<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>

<body>

    <main class="contenedor">

        <!-- Logo matemático -->
        <div class="logo-matematico" aria-label="Logo matemático">
            <span>×</span>
        </div>

        <header class="encabezado">

            <div class="encabezado-texto">
                <span class="etiqueta">TABLAS DE MULTIPLICAR</span>

                <h1>
                    Tabla del <strong>3</strong>
                </h1>

                <p>
                    Aprende, practica y domina las multiplicaciones
                    de una forma sencilla.
                </p>
            </div>

            <button class="btn-probar" onclick="generarTablas()">
                PROBAR
            </button>

        </header>


        <section class="tabla-container">
        <div id="contenedorTablas">
            <div class="tabla-header">
                <span>Operación</span>
                <span>Resultado</span>
            </div>

            <div class="fila">
                <span>3 × 1</span>
                <strong>3</strong>
            </div>

            <div class="fila">
                <span>3 × 2</span>
                <strong>6</strong>
            </div>

            <div class="fila">
                <span>3 × 3</span>
                <strong>9</strong>
            </div>

            <div class="fila">
                <span>3 × 4</span>
                <strong>12</strong>
            </div>

            <div class="fila">
                <span>3 × 5</span>
                <strong>15</strong>
            </div>

            <div class="fila">
                <span>3 × 6</span>
                <strong>18</strong>
            </div>

            <div class="fila">
                <span>3 × 7</span>
                <strong>21</strong>
            </div>

            <div class="fila">
                <span>3 × 8</span>
                <strong>24</strong>
            </div>

            <div class="fila">
                <span>3 × 9</span>
                <strong>27</strong>
            </div>

            <div class="fila">
                <span>3 × 10</span>
                <strong>30</strong>
            </div>
        </div>
        </section>


        <footer>

            <div class="simbolos-matematicos" aria-hidden="true">
                <span>+</span>
                <span>×</span>
                <span>÷</span>
                <span>−</span>
                <span>=</span>
                <span>π</span>
                <span>√</span>
            </div>

            <p>
                Creado por <strong>JAEVIT</strong>
            </p>

            <small>
                Practica • Aprende • Domina
            </small>

        </footer>

    </main>
    <script src="multiplicar.js"></script>
</body>
</html>
